<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Console - WoW Recorder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Raleway:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ink: { 900: '#0a0806', 800: '#0f0d0a', 700: '#141109', 600: '#1a1610', 500: '#221d15', 400: '#2e271d', 300: '#3d3529' },
                        parchment: { 900: '#f0e6cd', 700: '#d4ccb6', 500: '#a89c82', 400: '#8a8270', 300: '#6e6552' },
                        gold: { 500: '#c9a961', 400: '#d6b975', 600: '#a88a45' },
                    },
                    fontFamily: {
                        display: ['"IM Fell English"', 'Georgia', 'serif'],
                        sans: ['Raleway', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
                    },
                },
            },
        };
    </script>
    <style>
        [x-cloak] { display: none !important; }

        html, body { height: 100%; overflow: hidden; }
        body {
            background: #060504;
            color: #c8bfa8;
            font-family: 'Raleway', sans-serif;
            font-size: 13px;
        }

        .seam { border-color: #1c1710; }

        .nav-tab {
            display: inline-flex; align-items: center; height: 100%;
            padding: 0 12px; font-size: 11px; font-weight: 600; letter-spacing: 0.5px;
            color: #5a5244; border-bottom: 2px solid transparent;
            transition: color 0.12s, border-color 0.12s;
            text-decoration: none; font-family: 'Raleway', sans-serif;
        }
        .nav-tab:hover { color: #a89c82; }
        .nav-tab-active { color: #c9a961 !important; border-bottom-color: #c9a961; }

        /* Terminal */
        #terminal {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 12px;
            line-height: 1.6;
            overflow-y: auto;
            flex: 1;
            padding: 12px 16px;
            background: #060504;
        }
        #terminal::-webkit-scrollbar { width: 5px; }
        #terminal::-webkit-scrollbar-track { background: transparent; }
        #terminal::-webkit-scrollbar-thumb { background: #2e271d; border-radius: 3px; }
        #terminal::-webkit-scrollbar-thumb:hover { background: #3d3529; }

        .log-line {
            display: flex;
            gap: 10px;
            padding: 1px 0;
            border-radius: 2px;
        }
        .log-line:hover { background: rgba(255,255,255,0.025); }

        .log-ts {
            color: #3d3529;
            white-space: nowrap;
            flex-shrink: 0;
            user-select: none;
            font-size: 10px;
            padding-top: 2px;
        }
        .log-text { word-break: break-all; color: #b0a890; }
        .log-text.stderr { color: #e07070; }
        .log-text.stdout { color: #b0a890; }

        /* Colour keywords */
        .log-text .kw-error   { color: #e07070; }
        .log-text .kw-warn    { color: #ffb347; }
        .log-text .kw-ok      { color: #8fd06b; }
        .log-text .kw-obs     { color: #73adff; }
        .log-text .kw-info    { color: #c9a961; }
        .log-text .kw-websocket { color: #9d9dff; }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: #0d0b08;
            border-bottom: 1px solid #1c1710;
        }
        .tbtn {
            padding: 3px 10px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-radius: 3px;
            border: 1px solid #2e271d;
            background: #141109;
            color: #8a8270;
            cursor: pointer;
            font-family: 'Raleway', sans-serif;
            transition: all 0.1s;
        }
        .tbtn:hover { background: #1c1710; color: #c8bfa8; }
        .tbtn.active { background: rgba(201,169,97,0.15); color: #c9a961; border-color: rgba(201,169,97,0.4); }

        .filter-input {
            background: #141109;
            border: 1px solid #1c1710;
            border-radius: 3px;
            color: #c8bfa8;
            padding: 3px 10px;
            font-size: 11px;
            font-family: 'JetBrains Mono', monospace;
            width: 220px;
        }
        .filter-input:focus { outline: none; border-color: rgba(201,169,97,0.4); }
        .filter-input::placeholder { color: #3d3529; }

        .pill {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 10px; padding: 2px 8px; border-radius: 999px;
            background: #141109; border: 1px solid #221d15; color: #6e6552;
        }
        .count-badge {
            font-size: 10px; padding: 1px 6px; border-radius: 999px;
            background: #1a1610; color: #5a5244; font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>

<body>
    <div x-data="debugConsole()" x-init="init()" class="flex flex-col h-full">

        <!-- Top bar -->
        <header class="shrink-0 flex items-center gap-0 px-3 h-11 border-b seam" style="background:#0d0b08;">
            <h1 class="font-display text-base text-gold-500 tracking-wide shrink-0 mr-4">WoW Recorder</h1>
            <nav class="flex items-center h-full">
                <a href="/dashboard" class="nav-tab">Dashboard</a>
                <a href="/" class="nav-tab">Recordings</a>
                <a href="/stats" class="nav-tab">Stats</a>
                <a href="/clips" class="nav-tab">Clips</a>
                <a href="/config" class="nav-tab">Config</a>
                <a href="/debug" class="nav-tab nav-tab-active">Debug</a>
            </nav>
            <div class="flex items-center gap-2 ml-auto">
                <span class="pill" x-show="connected">
                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>Live
                </span>
                <span class="pill" x-show="!connected" x-cloak>
                    <span class="w-1.5 h-1.5 rounded-full bg-red-500"></span>Offline
                </span>
                <span class="count-badge" x-text="lines.length + ' lines'"></span>
            </div>
        </header>

        <!-- Toolbar -->
        <div class="toolbar shrink-0">
            <input class="filter-input" type="text" placeholder="Filter…" x-model="filter"
                @input="onFilterChange()">

            <div class="w-px h-4 bg-ink-400 mx-1"></div>

            <button class="tbtn" :class="showStdout ? 'active' : ''"
                @click="showStdout = !showStdout; applyFilter()">stdout</button>
            <button class="tbtn" :class="showStderr ? 'active' : ''"
                @click="showStderr = !showStderr; applyFilter()">stderr</button>

            <div class="w-px h-4 bg-ink-400 mx-1"></div>

            <button class="tbtn" :class="autoScroll ? 'active' : ''"
                @click="autoScroll = !autoScroll">Auto-scroll</button>

            <div class="flex-1"></div>

            <span class="text-parchment-300 text-xs font-mono" x-show="filter"
                x-text="filtered.length + ' matches'"></span>

            <button class="tbtn" @click="clearLog()">Clear</button>
        </div>

        <!-- Terminal output -->
        <div id="terminal" x-ref="terminal" @scroll="onScroll()">
            <template x-for="(entry, i) in filtered" :key="i">
                <div class="log-line">
                    <span class="log-ts" x-text="formatTs(entry.ts)"></span>
                    <span class="log-text" :class="entry.stream"
                        x-html="colorize(entry.line)"></span>
                </div>
            </template>
            <div x-show="filtered.length === 0" class="text-parchment-300 text-xs italic py-4">
                <span x-show="lines.length === 0">No output yet — the console will appear here once the backend starts logging.</span>
                <span x-show="lines.length > 0 && filter">No lines match the filter.</span>
            </div>
        </div>

    </div>

    <script>
        function debugConsole() {
            return {
                lines: [],
                filtered: [],
                filter: '',
                showStdout: true,
                showStderr: true,
                autoScroll: true,
                connected: false,
                socket: null,
                _userScrolledUp: false,

                init() {
                    this.socket = io();
                    this.socket.on('connect', () => { this.connected = true; });
                    this.socket.on('disconnect', () => { this.connected = false; });

                    // Full history on connect
                    this.socket.on('console_log_init', (entries) => {
                        this.lines = entries;
                        this.applyFilter();
                        this.$nextTick(() => this.scrollToBottom());
                    });

                    // Incremental lines
                    this.socket.on('log_line', (entry) => {
                        this.lines.push(entry);
                        if (this.lineVisible(entry)) {
                            this.filtered.push(entry);
                            if (this.autoScroll) {
                                this.$nextTick(() => this.scrollToBottom());
                            }
                        }
                    });
                },

                lineVisible(entry) {
                    if (entry.stream === 'stdout' && !this.showStdout) return false;
                    if (entry.stream === 'stderr' && !this.showStderr) return false;
                    if (this.filter && !entry.line.toLowerCase().includes(this.filter.toLowerCase())) return false;
                    return true;
                },

                applyFilter() {
                    this.filtered = this.lines.filter(e => this.lineVisible(e));
                },

                onFilterChange() {
                    this.applyFilter();
                    if (this.autoScroll) this.$nextTick(() => this.scrollToBottom());
                },

                clearLog() {
                    this.lines = [];
                    this.filtered = [];
                },

                scrollToBottom() {
                    const el = this.$refs.terminal;
                    if (el) el.scrollTop = el.scrollHeight;
                },

                onScroll() {
                    const el = this.$refs.terminal;
                    if (!el) return;
                    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
                    if (!atBottom) {
                        this.autoScroll = false;
                    }
                },

                formatTs(ts) {
                    if (!ts) return '';
                    const d = new Date(ts * 1000);
                    const hh = d.getHours().toString().padStart(2, '0');
                    const mm = d.getMinutes().toString().padStart(2, '0');
                    const ss = d.getSeconds().toString().padStart(2, '0');
                    return `${hh}:${mm}:${ss}`;
                },

                colorize(text) {
                    if (!text) return '';
                    // Escape HTML first
                    const escaped = text
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;');
                    // Apply keyword coloring
                    return escaped
                        .replace(/\b(error|ERROR|Error|exception|Exception|EXCEPTION|failed|FAILED|Failed)\b/g,
                            '<span class="kw-error">$1</span>')
                        .replace(/\b(warning|WARNING|Warning|warn|WARN)\b/g,
                            '<span class="kw-warn">$1</span>')
                        .replace(/\b(success|SUCCESS|Success|connected|Connected|CONNECTED|ok|OK|started|Started)\b/g,
                            '<span class="kw-ok">$1</span>')
                        .replace(/(\[OBS\]|\[obs\])/g,
                            '<span class="kw-obs">$1</span>')
                        .replace(/(\[WS\]|\[WEBSOCKET\]|\[WebSocket\])/g,
                            '<span class="kw-websocket">$1</span>')
                        .replace(/(\[APP\]|\[RECORDER\]|\[CONFIG\]|\[LOG\])/g,
                            '<span class="kw-info">$1</span>');
                },
            };
        }
    </script>
</body>

</html>
