name: Build Executables

on:
  push:
    tags:
      - 'v*'          # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual runs from the Actions tab

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: WoWRaidRecorder-linux
          - os: windows-latest
            artifact_name: WoWRaidRecorder-windows
          - os: macos-latest
            artifact_name: WoWRaidRecorder-macos

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Bundle Python backend with PyInstaller
        run: pyinstaller wow_raid_recorder.spec --noconfirm --clean

      - name: Install Node dependencies
        run: npm ci

      # ── Package the Electron app ────────────────────────────────────────────
      # extraResources in package.json pulls the PyInstaller output from
      # dist/WoWRaidRecorder into the packaged app, so build:python must run first.

      - name: Package Electron app (Linux)
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --publish=never

      - name: Package Electron app (Windows)
        if: runner.os == 'Windows'
        run: npx electron-builder --win --publish=never

      - name: Package Electron app (macOS)
        if: runner.os == 'macOS'
        env:
          # No Apple Developer certificate configured — skip codesigning/notarization
          # so the build doesn't fail trying to discover one. The app will only be
          # ad-hoc signed, so first launch requires right-click > Open on macOS.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --mac --publish=never

      # ── Upload build artifacts (always, so you can download from Actions tab) ─

      - name: Upload build artifact (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.AppImage
          retention-days: 14

      - name: Upload build artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*.exe
          retention-days: 14

      - name: Upload build artifact (macOS)
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14

  # ── Attach to GitHub Release (only on tag pushes) ──────────────────────────

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write   # Needed to create releases and upload assets

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
